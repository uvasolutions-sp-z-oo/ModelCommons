name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_published:
        description: Also install and audit the exact preview versions on public npm after owner approval
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install source-check dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify preview and local consumer packages
        run: npm run packages:verify-preview -- dist/npm-preview
      - name: Verify owner-approved versions on public npm
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_published }}
        run: npm run packages:verify-preview -- --published dist/npm-preview
      - name: Upload verified preview archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-preview-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            dist/npm-preview/*.tgz
            dist/npm-preview/provenance.json
